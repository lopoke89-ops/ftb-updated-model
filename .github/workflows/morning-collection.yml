name: Collect NBA morning gamebooks

on:
  schedule:
    - cron: '0,30 8-10 * * *'
      timezone: America/Chicago
    - cron: '0 11 * * *'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      date:
        description: 'Chicago game date to collect (YYYY-MM-DD); blank means yesterday'
        type: string
        required: false
      force:
        description: 'Recheck a completed batch for official corrections'
        type: boolean
        default: false
      verify_pdf_download:
        description: 'Also test an actual NBA PDF download and both parsers'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize with ordinary site releases so an older snapshot cannot publish last.
concurrency:
  group: pages-refs/heads/main
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      REQUESTED_DATE: ${{ inputs.date }}
      FORCE_RECHECK: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install PDF parsers
        run: python -m pip install -r scripts/requirements-collector.txt
      - name: Restore durable collection state
        run: python scripts/archive_store.py restore --source "nba ftb shi"
      - name: Check a real NBA download
        if: inputs.verify_pdf_download == true
        run: python scripts/morning_collect.py --probe scripts/fixtures/probe_game.json --state .pdf-probe
      - name: Collect previous-day finals and unresolved games
        id: collection
        shell: bash
        run: |
          args=()
          if [ -n "$REQUESTED_DATE" ]; then args+=(--date "$REQUESTED_DATE"); fi
          if [ "$FORCE_RECHECK" = "true" ]; then args+=(--force); fi
          python scripts/morning_collect.py "${args[@]}"
      - name: Verify collector, browser and publication
        if: steps.collection.outputs.publish_needed == 'true'
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s "nba ftb shi/tests" -p 'test_opening_gamebooks.py'
          node "nba ftb shi/tests/test_browser.cjs"
          node "nba ftb shi/tests/test_music.cjs"
          node "nba ftb shi/tests/test_analyst.cjs"
          node "nba ftb shi/tests/test_scouting.cjs"
          node "nba ftb shi/tests/test_readiness.cjs"
          node "nba ftb shi/tests/test_parlay.cjs"
          node "nba ftb shi/tests/test_live_refresh.cjs"
          node "nba ftb shi/tests/test_transition.cjs"
          node "nba ftb shi/tests/test_transition_export.cjs"
          node "nba ftb shi/tests/test_pages.cjs"
          python scripts/build_pages.py
      - name: Save verified records and retry state
        if: steps.collection.outputs.publish_needed == 'true'
        run: python scripts/archive_store.py persist
      - uses: actions/configure-pages@v5
        if: steps.collection.outputs.publish_needed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.collection.outputs.publish_needed == 'true'
        with:
          path: _site
      - name: Publish verified snapshot
        id: deployment
        if: steps.collection.outputs.publish_needed == 'true'
        uses: actions/deploy-pages@v4
      - name: Record successful publication
        if: steps.collection.outputs.publish_needed == 'true'
        run: python scripts/archive_store.py mark-published
