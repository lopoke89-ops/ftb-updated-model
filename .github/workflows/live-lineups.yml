name: Refresh official NBA lineups
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-nba-lineups
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check lineup collector
        run: python -m unittest discover -s scripts -p 'test_refresh_lineups.py'
      - name: Refresh projections and keep the game window checking every five minutes
        run: python scripts/refresh_lineups.py --watch --max-minutes 240 --lookahead-days 7
