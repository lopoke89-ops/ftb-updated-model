name: Capture FanDuel Tennessee prop odds
on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Worker duration in minutes (1-240; use 1 for a single capture)'
        type: number
        default: 240
permissions:
  contents: write
concurrency:
  group: fanduel-tennessee-odds
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install timezone database
        run: python -m pip install tzdata
      - name: Check price identity and settlement contracts
        run: python -m unittest discover -s scripts -p 'test_fanduel_odds.py'
      - name: Capture prices and maintain the two-minute pregame worker
        env:
          WATCH_MAX_MINUTES: ${{ inputs.max_minutes || 240 }}
        run: python scripts/fanduel_odds.py --watch --max-minutes "$WATCH_MAX_MINUTES"
