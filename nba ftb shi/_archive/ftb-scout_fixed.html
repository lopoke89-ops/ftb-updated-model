function getAllGameDates() {
  const start = new Date("2025-10-21");
  const end = new Date("2026-03-10"); // today
  const dates = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {

// ─── EXTRACT FIRST SCORING PLAY FROM ESPN SUMMARY ────────────────────────────
// Returns { [normalisedTeamAbbr]: play } with one entry per team.
//
// ROOT CAUSE (final fix): For COMPLETED historical games ESPN does NOT set
// `scoringPlay: true` on individual play objects. Instead the response has:
//   pbpRaw.scoringPlays = [2, 5, 11, ...]   ← indices into pbpRaw.plays[]
// This is the only reliable way to identify scoring plays in old game data.
// Live/in-progress games use the boolean flag, so we support both.
//
// Detection order:
//   1. scoringPlays index array  (completed games — most reliable)
//   2. play.scoringPlay flag     (live/in-progress games)
//   3. play.type.text "made"     (secondary live signal)
//   4. text contains " makes "   (text-based fallback)
//   5. score-change detection    (last resort)
//

  // Normalise ESPN abbreviation variants to canonical codes

  function normAbbr(raw) {
    const u = (raw || "").toUpperCase();
    return ABBR_MAP[u] || u;
  }
  function getTeamAbbr(play) {
    return normAbbr(
      (play.team && (play.team.abbreviation || play.team.shortDisplayName)) || ""
    );
  }

  const firstByTeam = {};
  function tryAdd(play) {
    const abbr = getTeamAbbr(play);
    if (abbr && !firstByTeam[abbr]) firstByTeam[abbr] = play;
  }
  function done() { return Object.keys(firstByTeam).length >= 2; }

  // ── Tier 1: scoringPlays index array (completed/historical games) ──────────
  const scoringIndexes = (data && data.scoringPlays) || [];
  if (scoringIndexes.length > 0) {
    for (const idx of scoringIndexes) {
      const play = plays[idx];
      if (play) tryAdd(play);
      if (done()) return firstByTeam;
    }
    // If we got at least one via this path, return what we have
    if (Object.keys(firstByTeam).length > 0) return firstByTeam;
  }

  // ── Tier 2: scoringPlay boolean flag (live/in-progress games) ─────────────
  for (const play of plays) {
    if (play.scoringPlay === true) tryAdd(play);
    if (done()) return firstByTeam;
  }

  // ── Tier 3: pointAfterDrive + "made" event type ───────────────────────────
  if (!done()) {
    for (const play of plays) {
      if (play.pointAfterDrive && play.type && play.type.text &&
          play.type.text.toLowerCase().includes("made")) {
        tryAdd(play);
        if (done()) return firstByTeam;
      }
    }
  }

  // ── Tier 4: text contains " makes " ──────────────────────────────────────
  if (!done()) {
    for (const play of plays) {
      const text = (play.text || play.description || "").toLowerCase();
      if ((text.includes(" makes ") || text.includes(" scores")) &&
          !text.includes(" misses ")) {
        tryAdd(play);
        if (done()) return firstByTeam;
      }
    }
  }

  // ── Tier 5: first play with non-zero score per team ───────────────────────
  if (!done()) {
    let awayHit = false, homeHit = false;
    for (const play of plays) {
      const abbr = getTeamAbbr(play);
      if (!awayHit && play.awayScore > 0 && play.homeScore === 0) {
        if (abbr && !firstByTeam[abbr]) { firstByTeam[abbr] = play; awayHit = true; }
      }
      if (!homeHit && play.homeScore > 0) {
        if (abbr && !firstByTeam[abbr]) { firstByTeam[abbr] = play; homeHit = true; }
      }
      if (done()) return firstByTeam;
    }
  }

  return Object.keys(firstByTeam).length > 0 ? firstByTeam : null;
}

// ─── ESPN PLAYER NAME EXTRACTOR ──────────────────────────────────────────────
// ESPN summary plays reliably embed the scorer's name in play.text but the
// structured participants / athletesInvolved fields are often absent or empty.
// This function tries every known ESPN field shape before falling back to
// parsing the name directly out of the description text.
//
// Known ESPN text formats (all observed in the wild):
//   "Donovan Mitchell makes 19-foot two point shot"
//   "Karl-Anthony Towns makes 22-foot jumper"
//   "Giannis Antetokounmpo makes layup"
//   "Steph Curry makes 26-foot three point jumper"
//   "LeBron James free throw 1 of 1"
//   "Nikola Jokic Scores" (rare recap format)
//
function extractPlayerNameFromPlay(play) {
  if (!play) return "Unknown";

  // 1. participants[0].athlete.displayName  (ESPN game-detail shape)
  const p0 = play.participants && play.participants[0];
  if (p0) {
    const n = (p0.athlete && p0.athlete.displayName) ||
              (p0.athlete && p0.athlete.fullName) ||
              p0.displayName || p0.fullName || p0.name;
    if (n) return n;
  }

  // 2. athletesInvolved[0].displayName  (ESPN summary shape, older seasons)
  const ai0 = play.athletesInvolved && play.athletesInvolved[0];
  if (ai0) {
    const n = ai0.displayName || ai0.fullName || ai0.name;
    if (n) return n;
  }

  // 3. play.athlete.displayName  (some ESPN boxscore-embedded shapes)
  if (play.athlete) {
    const n = play.athlete.displayName || play.athlete.fullName || play.athlete.name;
    if (n) return n;
  }

  // 4. Parse the player name directly from play.text
  //    The name always appears BEFORE the action verb in ESPN descriptions.
  //    Action verbs: "makes", "scores", "free throw", "misses" (shouldn't appear
  //    in a scoring play but guard anyway), "enters", "commits".
  const text = (play.text || play.description || "").trim();
  if (text) {
    // Verbs that reliably mark the end of the player name segment
    const actionPattern = /\s+(makes|scores|free\s+throw|hits|converts|with)\b/i;
    const m = text.match(actionPattern);
    if (m) {
      const candidate = text.slice(0, m.index).trim();
      // Sanity check: must look like a real name (2–40 chars, starts with capital)
      if (candidate.length >= 2 && candidate.length <= 40 && /^[A-Z]/.test(candidate)) {
        return candidate;
      }
    }
    // Fallback within text: grab everything before the first number or parenthesis
    // Handles "LeBron James 19-foot..." edge cases
    const m2 = text.match(/^([A-Z][A-Za-z'\-\.\s]{2,35?})\s+\d/);
    if (m2) {
      const candidate = m2[1].trim();
      if (candidate.length >= 2) return candidate;
    }
  }

  return "Unknown";
}

// ─── AGGREGATE: build position FTB data from raw events ──────────────────────
function aggregatePositionData(events) {
  // events: [{ defendingTeam, pos }]
  const counts = {}; // team -> { PG:0, SG:0, ... }
  const ALL_TEAMS = ["ATL", "BOS", "BKN", "CHA", "CHI", "CLE", "DAL", "DEN", "DET", "GSW", "HOU", "IND", "LAC", "LAL", "MEM", "MIA", "MIL", "MIN", "NOP", "NYK", "OKC", "ORL", "PHI", "PHX", "POR", "SAC", "SAS", "TOR", "UTA", "WAS"];
  ALL_TEAMS.forEach(t => counts[t] = {
    PG: 0,
    SG: 0,
    SF: 0,
    PF: 0,
    C: 0,
    unknown: 0
  });
  for (const ev of events) {
    if (!ev.defendingTeam || !counts[ev.defendingTeam]) continue;
    const pos = ev.pos || "unknown";
    if (pos in counts[ev.defendingTeam]) counts[ev.defendingTeam][pos]++;else counts[ev.defendingTeam].unknown++;
  }

  // Convert to percentages (exclude unknown for display)
  const result = {};
  for (const [team, raw] of Object.entries(counts)) {
    const known = raw.PG + raw.SG + raw.SF + raw.PF + raw.C;
    if (known < 3) continue; // not enough data
    result[team] = {
      PG: Math.round(raw.PG / known * 100),
      SG: Math.round(raw.SG / known * 100),
      SF: Math.round(raw.SF / known * 100),
      PF: Math.round(raw.PF / known * 100),
      C: Math.round(raw.C / known * 100),
      totalGames: known
    };
  }
  return result;
}
